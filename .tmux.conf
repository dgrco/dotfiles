# ==========================================
# REBIND PREFIX KEY
# ==========================================
# Change default Ctrl+b to Ctrl+a for better ergonomics
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# ==========================================
# QUALITY OF LIFE SETTINGS
# ==========================================
# Reduce escape-time delay (crucial for Vim/Neovim responsiveness)
set -s escape-time 0
# Increase scrollback buffer capacity
set -g history-limit 50000
# Increase tmux message display duration to 4 seconds
set -g display-time 4000
# Refresh status line intervals more frequently (default is 15)
set -g status-interval 5
# Enable full mouse support (clicking, resizing, scrolling)
set -g mouse on
# Fix terminal colors (enables TrueColor support)
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",*:RGB"
set -g set-titles on
set -g set-titles-string "#T"
set -as terminal-features ",*:sync"

# ==========================================
# STATUS BAR STYLING
# ==========================================
# Solid grey background across the whole status line
set -g status-style "bg=colour234,fg=colour245"
set -g status-left-length 20
set -g status-right-length 40

# Left side: session
set -g status-left " #S "
set -g status-left-style "bg=colour14,fg=colour234,bold"

# Right side: date, time, hostname
set -g status-right " %Y-%m-%d | %H:%M #h "
set -g status-right-style "bg=colour234,fg=colour245"

# Window list (inactive vs active)
set -g window-status-format " #I:#W "
set -g window-status-style "bg=colour234,fg=colour244"

set -g window-status-current-format " #I:#W "
set -g window-status-current-style "bg=colour2,fg=colour234,bold"

# Command / message line, matches status bar bg.
# fill= is what paints the rest of the line; without it tmux only styles the
# cells the text occupies and the old status bar shows through behind it.
set -g message-style "bg=colour234,fg=colour254,fill=colour234"
set -g message-command-style "bg=colour234,fg=colour254,fill=colour234"

# ==========================================
# PANE BORDERS (left neutral, untouched)
# ==========================================
set -g pane-border-style "fg=default"
set -g pane-active-border-style "fg=default"

# ==========================================
# WINDOW & PANE MANAGEMENT
# ==========================================
# Start window and pane indexing at 1 instead of 0
set -g base-index 1
setw -g pane-base-index 1
# Automatically renumber windows when one is closed
set -g renumber-windows on
# Prevent tmux from automatically renaming windows based on active commands
set-option -g allow-rename off
# Split panes using logical visual indicators (| and -)
# Also ensures new panes open in the current working directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %
# Open new windows in the current working directory
bind c new-window -c "#{pane_current_path}"

# ==========================================
# NAVIGATION & SHORTCUTS
# ==========================================
# Vim-style pane selection
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
# Use Shift-Arrow keys without prefix key to switch windows
bind -n S-Left  previous-window
bind -n S-Right next-window
# Fast configuration reloading with Prefix + r
bind r source-file ~/.tmux.conf \; display "Configuration Reloaded!"
set-window-option -g mode-keys vi

bind-key -n M-1 select-window -t 1
bind-key -n M-2 select-window -t 2
bind-key -n M-3 select-window -t 3
bind-key -n M-4 select-window -t 4
bind-key -n M-5 select-window -t 5
bind-key -n M-6 select-window -t 6
bind-key -n M-7 select-window -t 7
bind-key -n M-8 select-window -t 8
bind-key -n M-9 select-window -t 9
bind-key -n M-s choose-session
# Toggle zoom on the current pane
bind-key -n M-z resize-pane -Z
