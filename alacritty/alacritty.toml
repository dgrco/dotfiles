general.import = [
    "~/.config/alacritty/themes/slabaster-hearth.toml"
]

[window]
padding.x = 10
padding.y = 10
decorations = "None"

[scrolling]
history = 10000
multiplier = 3

[font]
normal = { family = "CaskaydiaMono NFM", style = "Regular" }
bold   = { family = "CaskaydiaMono NFM", style = "Bold" }
italic = { family = "CaskaydiaMono NFM", style = "Italic" }
size = 13

[font.offset]
x = 0
y = 0

[font.glyph_offset]
x = 0
y = 0

[cursor]
# style = { blinking = "Always" }
# blink_interval = 500

# Basic selection and search colors
[selection]
save_to_clipboard = true

# Keybindings
[[keyboard.bindings]]
key = "V"
mods = "Control|Shift"
action = "Paste"

[[keyboard.bindings]]
key = "C"
mods = "Control|Shift"
action = "Copy"
